<script>
function sendMessage() {
  const name = document.getElementById("name").value;
  const msg = document.getElementById("message").value;

  fetch("YAHAN_APNA_WEBHOOK_URL", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      content: "[WEB] " + name + ": " + msg
    })
  });

  alert("Message Sent!");
}
</script>
